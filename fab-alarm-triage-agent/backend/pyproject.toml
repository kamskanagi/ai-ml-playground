[project]
name = "fab-alarm-triage-backend"
version = "0.1.0"
description = "FastAPI MES + LangGraph alarm triage agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.38",
    "sqlalchemy>=2.0.54,<2.1",
    # SQLAlchemy's async bridge needs greenlet; it is not pulled in automatically on 3.13.
    "greenlet>=3.1",
    "psycopg[binary,pool]>=3.3,<3.4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15,<3",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langchain-core>=1,<2",
    "langchain-groq>=1.1,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "numpy>=2.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
