# A single-node cluster with the ports an ingress controller needs mapped to the host,
# so http://localhost:8081 reaches the dashboard exactly as a real ingress would.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fab-triage
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
