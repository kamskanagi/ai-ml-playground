# One host, one origin: the dashboard and the API are served from the same place, so the
# browser needs no CORS and the front end needs no per-environment API base URL.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fab-triage
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
