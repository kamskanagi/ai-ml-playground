apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fab-triage

resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - mcp.yaml
  - frontend.yaml
  - ingress.yaml

configMapGenerator:
  - name: fab-config
    literals:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=fab
      - POSTGRES_DB=fab_mes
      - BACKEND_URL=http://backend:8000
      - MCP_URL=http://mcp:9000/mcp
      - GROQ_MODEL=llama-3.3-70b-versatile
      - MAX_TOOL_CALLS=12
      - EVAL_REPORTS_DIR=/srv/eval-reports

secretGenerator:
  - name: fab-secrets
    literals:
      - POSTGRES_PASSWORD=fab
      # Empty by default. Triage needs a real key; set it with
      #   kubectl -n fab-triage create secret generic fab-secrets ... --dry-run=client
      # or an overlay, never by committing it here.
      - GROQ_API_KEY=

generatorOptions:
  disableNameSuffixHash: true
