apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          image: fab-triage/mcp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: BACKEND_URL
              value: http://backend:8000
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_PORT
              value: "9000"
          # The MCP server exposes no health endpoint of its own; a TCP check is honest
          # about what it actually tells us, which is that the port is open.
          readinessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
