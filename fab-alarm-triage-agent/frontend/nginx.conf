server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The dashboard is a single-page app: any unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so the browser needs no CORS and no separate base URL per environment.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
